name: 自动更新直播源

on:
  schedule:
    - cron: "30 22 * * *"   # 北京时间每天 06:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 拉取各直播源
        run: |
          mkdir -p raw
          curl -sL -m 90 -o raw/tvlive.txt "https://raw.githubusercontent.com/qist/tvbox/master/tvlive.txt" || true
          curl -sL -m 90 -o raw/zb.txt "https://raw.githubusercontent.com/qist/tvbox/master/zb.txt" || true
          curl -sL -m 90 -o raw/list.txt "https://raw.githubusercontent.com/qist/tvbox/master/list.txt" || true
          curl -sL -m 90 -o raw/fml_ipv6.m3u "https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/ipv6.m3u" || true
          curl -sL -m 90 -o raw/iptv_org_cn.m3u "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/cn.m3u" || true

      - name: 合并去重生成 live.txt
        run: |
          python3 merge.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: 自动更新直播源 $(date -u +%Y-%m-%d)"
          git push
