name: 自动更新源(每3天)

on:
  schedule:
    - cron: "30 22 */3 * *"   # 北京时间每3天 06:30 自动更新
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 更新播放源(国内点播/直播各5个, 海外各5个)
        run: python update_sources.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: 每3天自动更新播放源 $(date -u +%Y-%m-%d)"
          git push
